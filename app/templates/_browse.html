<div class="browser">
  <div class="browser-path mono">{{ path }}</div>
  <div class="row tight">
    {% if parent %}
      <button class="button ghost small" type="button"
              hx-get="/browse?path={{ parent|urlencode }}{% if show_hidden %}&amp;hidden=1{% endif %}"
              hx-target="#dir-picker-body" hx-swap="innerHTML">↑ Übergeordneter Ordner</button>
    {% endif %}
    <label class="check small">
      <input type="checkbox" {% if show_hidden %}checked{% endif %}
             hx-get="/browse?path={{ path|urlencode }}{% if not show_hidden %}&amp;hidden=1{% endif %}"
             hx-target="#dir-picker-body" hx-swap="innerHTML">
      Versteckte Ordner
    </label>
  </div>

  <ul class="browser-list">
    {% for entry in entries %}
      <li>
        <button class="browser-open" type="button"
                hx-get="/browse?path={{ entry.path|urlencode }}{% if show_hidden %}&amp;hidden=1{% endif %}"
                hx-target="#dir-picker-body" hx-swap="innerHTML">
          📁 {{ entry.name }}
        </button>
        <button class="button ghost small" type="button" data-pick-dir="{{ entry.path }}">Auswählen</button>
      </li>
    {% else %}
      <li class="muted small">Keine Unterordner.</li>
    {% endfor %}
  </ul>

  <div class="row">
    <input id="browse-manual" placeholder="/vollständiger/pfad" value="{{ path }}" spellcheck="false" autocomplete="off">
    <button class="button ghost small" type="button" data-pick-dir="" data-pick-from="#browse-manual">Diesen Pfad übernehmen</button>
  </div>
</div>
