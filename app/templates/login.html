<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ t('login.title') }} · {{ t('brand.name') }} {{ t('brand.sub') }}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="login-body">
<main class="login-card">
  <div class="brand brand-large">
    <span class="logo">⇪</span>
    <span>{{ t('brand.name') }}<span class="brand-sub">{{ t('brand.sub') }}</span></span>
  </div>
  <p class="muted">{{ t('login.subtitle') }}</p>

  {% if error %}<div class="flash err" role="alert">{{ error }}</div>{% endif %}

  <form method="post" action="/login" class="form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>
      {{ t('login.password') }}
      <input type="password" name="password" autocomplete="current-password" autofocus required>
    </label>
    <button class="button primary wide" type="submit">{{ t('login.submit') }}</button>
  </form>
  <p class="hint-text">{{ t('login.hint') }}</p>

  <div class="lang-switch lang-switch-center" role="group" aria-label="{{ t('language.switch') }}">
    {% for code in ('de', 'en') %}
      <a href="/language/{{ code }}?next=/login"
         class="{{ 'active' if lang == code else '' }}"
         hreflang="{{ code }}" lang="{{ code }}">{{ code|upper }}</a>
    {% endfor %}
  </div>
</main>
</body>
</html>
