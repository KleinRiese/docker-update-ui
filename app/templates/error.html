{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>{{ title }}</h1>
    <p class="muted">{{ t('error.request_failed') }}</p>
  </div>
</div>
<div class="notice err">{{ message }}</div>
<div class="row">
  <a class="button ghost" href="/">{{ t('error.back') }}</a>
</div>
{% endblock %}
